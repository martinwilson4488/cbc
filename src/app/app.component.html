<div class="shell">
  <!-- Page Header -->
  <div class="billing-header">
    <app-header></app-header>
  </div>
  <main class="content">

    <!-- Search and Date Filters -->
    <div class="filters-row">
      <app-date-range (dateRangeChange)="onDateRangeChange($event)">
      </app-date-range>

      <app-action-button [label]="uiConfig.filtersButtonLabel" variant="outline">
      </app-action-button>
    </div>
    <!-- searchbar -->
    <section class="search-row">
      <app-search-bar [placeholder]="uiConfig.searchPlaceholder" (searchChange)="onSearchChange($event)">
      </app-search-bar>

      <app-action-button [label]="uiConfig.mapSkuButtonLabel" variant="link">
      </app-action-button>
    </section>

    <!-- Billing Tabs -->
    <nav class="tabs">
      <app-action-button *ngFor="let tab of billingTabs" variant="outline" [label]="tab.label"
        [active]="activeTab === tab.value" (clicked)="setTab(tab.value)">
      </app-action-button>
    </nav>

    <!-- Selected Records Actions -->
    <div class="toolbar">
      <div *ngIf="selectedIds.size > 0">
        <span>{{ selectedIds.size }} record(s) selected</span>
        <app-action-button variant="link" label="Download Selected" (clicked)="downloadSelectedRecords()">
        </app-action-button>
        <app-action-button variant="link" label="Clear Selection" (clicked)="clearSelection()">
        </app-action-button>
      </div>
      <div class="download">
        <app-action-button label="uiConfig.downloadButtonLabel" iconSrc="../../assets/images/download.svg"
          variant="icon" ariaLabel="uiConfig.downloadButtonLabel" (clicked)="openDownloadPanel()">
        </app-action-button>
      </div>
    </div>

    <!-- Billing Table -->
    <app-billing-table [data]="paginatedData" [selectedIds]="selectedIds" (selectionChange)="onSelectionChange($event)">
    </app-billing-table>

    <div class="empty-state" *ngIf="filteredData.length === 0">
      {{ uiConfig.noRecordsMessage }}
    </div>

    <!-- Pagination -->
    <app-pagination [currentPage]="currentPage" [pageSize]="pageSize" [totalItems]="filteredData.length"
      (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>
  </main>
</div>

<!-- Download Side Panel -->
<app-side-panel [visible]="downloadPanelVisible" [title]="downloadPanelConfig.title" [tabs]="downloadPanelConfig.tabs"
  [activeTab]="activeDownloadTab" [primaryActionLabel]="downloadPanelConfig.primaryActionLabel"
  [primaryActionDisabled]="!canDownload" (closed)="closeDownloadPanel()" (activeTabChange)="onDownloadTabChange($event)"
  (primaryAction)="downloadSelectedStatuses()">

  <!-- Dynamic Content -->
  <ng-container *ngTemplateOutlet="
      activeDownloadTabConfig?.templateType === 'statuses'? allChargesTab : negativeChargesTab ">
  </ng-container>

</app-side-panel>

<!-- Status Download Template -->
<ng-template #allChargesTab>
  <div class="panel-content-container d-flex flex-column">

    <div class="download-status-option" *ngFor="let option of availableStatuses">

      <mat-checkbox [checked]="selectedStatuses.has(option.value)"
        (change)="toggleStatus(option.value, $event.checked)">

        {{ option.label }}

      </mat-checkbox>
    </div>

  </div>
</ng-template>

<!-- Negative Charges Template -->
<ng-template #negativeChargesTab>
  <form [formGroup]="negativeChargesForm" class="panel-content-container d-flex flex-column">

    <span class="description-text">
      {{ downloadPanelConfig.negativeChargesHelp }}
    </span>

    <ng-container *ngFor="let control of controlOptions">
      <ng-container *ngTemplateOutlet="filterDropdown; context: {
          label: control.label,
          placeholder: control.value === controlOptions[0].value
            ? downloadPanelConfig.countryPlaceholder
            : downloadPanelConfig.vendorPlaceholder,
          controlName: control.value,
          options: control.value === controlOptions[0].value
            ? countryOptions
            : vendorOptions,
          elementId: 'download-' + control.value
        }">
      </ng-container>
    </ng-container>

  </form>
</ng-template>

<ng-template #filterDropdown let-label="label" let-placeholder="placeholder" let-controlName="controlName"
  let-options="options" let-elementId="elementId">

  <div class="dropdown-holder d-flex flex-column">
    <div class="title">
      {{ label }}
      <span class="mandatory-star">*</span>
    </div>

    <select [id]="elementId" class="form-control" [formControlName]="controlName">

      <option value="">{{ placeholder }}</option>

      <option *ngFor="let option of options" [value]="option.value">
        {{ option.label }}
      </option>
    </select>
  </div>

</ng-template>
