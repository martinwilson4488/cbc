<div class="pagination-wrap">
  <div class="summary">
    {{ startItem }}-{{ endItem }} out of {{ totalItems }}
  </div>

  <div class="controls">
    <!-- Previous page -->
    <app-action-button
      variant="icon"
      label="Previous page"
      title="Previous page"
      ariaLabel="Previous page"
      iconSrc="assets/images/left-arrow.svg"
      [disabled]="page === 1"
      (clicked)="goTo(page - 1)">
    </app-action-button>

    <!-- Page numbers -->
    <ng-container *ngFor="let p of pages">
      <span *ngIf="p === -1" class="ellipsis">…</span>

      <app-action-button
        *ngIf="p !== -1"
        variant="page"
        [label]="p.toString()"
        [title]="'Page ' + p"
        [ariaLabel]="'Go to page ' + p"
        [active]="p === page"
        [disabled]="p === page"
        (clicked)="goTo(p)">
      </app-action-button>
    </ng-container>

    <!-- Next page -->
    <app-action-button
      variant="icon"
      label="Next page"
      title="Next page"
      ariaLabel="Next page"
      iconSrc="assets/images/right-arrow.svg"
      [disabled]="page >= totalPages"
      (clicked)="goTo(page + 1)">
    </app-action-button>
  </div>

  <!-- Items per page -->
  <label class="page-size">
    Items per page

    <select
      [value]="pageSize"
      (change)="changeSize($any($event.target).value)">
      <option *ngFor="let size of pageSizes" [value]="size">
        {{ size }}
      </option>
    </select>
  </label>
</div>
