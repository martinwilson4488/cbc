<header class="cbc-header">
  <div class="header-left">
    <a class="brand" href="#" aria-label="TD SYNNEX home">
      <span class="brand-symbol" aria-hidden="true"><img src="../../assets/images/Symbols.svg" alt=""></span>
      <span class="brand-name"><img src="../../assets/images/Shape.svg" alt="TD SYNNEX"></span>
    </a>

    <div class="product-selector">
      <app-action-button
        [label]="productName"
        iconSrc="../../assets/images/arrow-down.svg"
        variant="dropdown"
        [ariaLabel]="'Select product. Current product: ' + productName"
        [title]="productName"
        (clicked)="toggleProductMenu()">
      </app-action-button>

      <div class="product-menu" *ngIf="menuOpen">
        <app-action-button
          *ngFor="let product of products"
          [label]="product"
          variant="menu"
          (clicked)="selectProduct(product)">
        </app-action-button>
      </div>
    </div>
  </div>

  <div class="header-right">
    <app-action-button
      label="Quick actions"
      iconSrc="../../assets/images/AI.svg"
      variant="icon"
      ariaLabel="Quick actions">
    </app-action-button>

    <app-action-button
      label="Settings"
      iconSrc="../../assets/images/app-list.svg"
      variant="icon"
      ariaLabel="Settings">
    </app-action-button>

    <app-action-button
      class="profileClass"
      [label]="userName"
      iconSrc="../../assets/images/user.svg"
      variant="menu"
      ariaLabel="User profile"
      title="User profile">
    </app-action-button>
  </div>
</header>
